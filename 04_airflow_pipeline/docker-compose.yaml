x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_AIRFLOW_PASSWORD}@postgres-airflow/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    # Lecture-écriture : les tâches d'extraction y téléchargent de nouvelles images
    # (common/storage.download_image), exactement comme lors d'un run local de l'étape 2.
    - ../02_extraction_scripts:/opt/airflow/checkitai/02_extraction_scripts
    # Lecture seule : la tâche transform() n'importe que des fonctions Python de l'étape 3,
    # elle n'écrit aucun fichier dans ce dossier (le chargement va directement en base).
    - ../03_transformation_pipeline:/opt/airflow/checkitai/03_transformation_pipeline:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres-airflow:
      condition: service_healthy

services:
  # Base de données interne d'Airflow (métadonnées : DAGs, runs, connections chiffrées...)
  # séparée de la base cible du pipeline pour ne jamais mélanger les deux rôles.
  postgres-airflow:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Base cible du pipeline ETL (schéma sources/publications). Rôle applicatif à
  # privilèges limités créé par sql/init_checkitai_db.sh au premier démarrage.
  postgres-checkitai:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_CHECKITAI_ADMIN_PASSWORD}
      POSTGRES_DB: checkitai
      CHECKITAI_ETL_PASSWORD: ${CHECKITAI_ETL_PASSWORD}
    volumes:
      - postgres-checkitai-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432" # exposé uniquement pour inspection locale (ex. DBeaver) pendant le développement
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Christophe \
          --lastname Ringot \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-airflow-data:
  postgres-checkitai-data:
